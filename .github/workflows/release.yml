name: release-firmware

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-firmware:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: ${{ runner.os }}-platformio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-platformio-

      - name: Install PlatformIO Core
        run: pip install platformio

      - name: Run full repo verification
        run: ./scripts/verify-repo.sh --full

      - name: Build ESP32 firmware
        run: pio run -e esp32dev

      - name: Prepare release assets
        run: |
          mkdir -p dist
          cp .pio/build/nodemcuv2/firmware.bin dist/motorsport-data-acquisition-nodemcuv2-firmware.bin
          cp .pio/build/nodemcuv2/firmware.elf dist/motorsport-data-acquisition-nodemcuv2-firmware.elf
          cp .pio/build/esp32dev/firmware.bin dist/motorsport-data-acquisition-esp32dev-firmware.bin
          cp .pio/build/esp32dev/firmware.elf dist/motorsport-data-acquisition-esp32dev-firmware.elf
          python ~/.platformio/packages/tool-esptoolpy/esptool.py --chip esp32 merge_bin \
            --output dist/motorsport-data-acquisition-esp32dev-factory.bin \
            --flash_mode dio --flash_freq 40m --flash_size 16MB \
            0x1000 .pio/build/esp32dev/bootloader.bin \
            0x8000 .pio/build/esp32dev/partitions.bin \
            0xe000 ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin \
            0x10000 .pio/build/esp32dev/firmware.bin
          jq --null-input \
            --arg version "$GITHUB_REF_NAME" \
            --arg commit "$GITHUB_SHA" \
            '{schema_version: 1, version: $version, commit_sha: $commit, targets: [{environment: "nodemcuv2", flash_size: "4MB", partition_layout: "framework default"}, {environment: "esp32dev", flash_size: "16MB", partition_layout: "partitions/esp32-16mb-store-forward.csv"}]}' \
            > dist/build-metadata.json
          (
            cd dist
            sha256sum \
              motorsport-data-acquisition-nodemcuv2-firmware.bin \
              motorsport-data-acquisition-nodemcuv2-firmware.elf \
              motorsport-data-acquisition-esp32dev-firmware.bin \
              motorsport-data-acquisition-esp32dev-firmware.elf \
              motorsport-data-acquisition-esp32dev-factory.bin \
              build-metadata.json \
              > SHA256SUMS
          )

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/motorsport-data-acquisition-nodemcuv2-firmware.bin
            dist/motorsport-data-acquisition-nodemcuv2-firmware.elf
            dist/motorsport-data-acquisition-esp32dev-firmware.bin
            dist/motorsport-data-acquisition-esp32dev-firmware.elf
            dist/motorsport-data-acquisition-esp32dev-factory.bin
            dist/build-metadata.json
            dist/SHA256SUMS
