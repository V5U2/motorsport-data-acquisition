[platformio]
default_envs = nodemcuv2

[env:nodemcuv2]
platform = espressif8266@^4.2.1
board = nodemcuv2
framework = arduino
monitor_speed = 115200
upload_speed = 460800
lib_ldf_mode = deep+
build_unflags =
  -std=gnu++11
build_flags =
  -std=gnu++17
  -D USER_SETUP_LOADED
  -D TFT_WIDTH=480
  -D TFT_HEIGHT=320
  -include include/TFT_Setup.h
lib_deps =
  adafruit/Adafruit ADS1X15@^2.5.0
  adafruit/RTClib@^2.1.4
  bodmer/TFT_eSPI@^2.5.43
  knolleary/PubSubClient@^2.8
